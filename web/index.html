<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="theme-color" content="#000000" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icon-192.png?v=d9a7d144671e" type="image/png" />
        <link rel="stylesheet" href="/style.css" />
        <title>Remote Smart Trackpad</title>
    </head>
    <body>
        <main class="app">
            <header class="topbar">
                <div id="connection" role="status" aria-live="polite">
                    <span class="status-dot"></span><span id="connection-label"></span>
                </div>
                <button
                    id="options-toggle"
                    aria-label="Options"
                    aria-expanded="false"
                    aria-controls="options"
                    data-icon="more"
                ></button>
                <button id="editor-close" hidden><span data-icon="close"></span>Close text editor</button>
            </header>
            <section id="pairing" class="pairing" hidden>
                <h1>Connect this device</h1>
                <form id="pair-form">
                    <label>Your name<input id="pair-name" autocomplete="name" maxlength="80" required /></label>
                    <label id="pair-code-label"
                        >Pairing code from your PC<input
                            id="pair-code"
                            inputmode="numeric"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            autocomplete="one-time-code"
                            required
                    /></label>
                    <button type="submit">Connect</button>
                </form>
                <p id="pair-error" role="alert"></p>
            </section>
            <div id="controls">
                <pointer-pad></pointer-pad>
                <div class="input-dock">
                    <text-editor hidden></text-editor>
                    <key-rows></key-rows>
                    <div class="editor-launch">
                        <button id="editor-open" aria-label="Open text editor" data-icon="text"></button>
                    </div>
                </div>
            </div>
            <button id="options-dismiss" aria-label="Close options" tabindex="-1" hidden></button>
            <!-- Option defaults live in these attributes; values stored on the phone override them. -->
            <div id="options" class="options" role="region" aria-label="Options" hidden>
                <label
                    ><input type="checkbox" name="mouseSliding" /><span class="checkbox" data-icon="check"></span>Mouse
                    sliding</label
                >
                <div class="speed-setting">
                    <label for="mouse-acceleration"
                        >Mouse acceleration
                        <output id="mouse-acceleration-value" for="mouse-acceleration">1×</output></label
                    >
                    <input
                        id="mouse-acceleration"
                        name="mouseAcceleration"
                        type="range"
                        min="0"
                        max="2"
                        step="0.25"
                        value="1"
                    />
                </div>
                <div class="speed-setting">
                    <label for="mouse-speed"
                        >Mouse speed <output id="mouse-speed-value" for="mouse-speed">1×</output></label
                    >
                    <input id="mouse-speed" name="mouseSpeed" type="range" min="0.25" max="16" step="0.25" value="1" />
                </div>
                <div class="speed-setting">
                    <label for="scroll-speed"
                        >Scroll speed (X &amp; Y) <output id="scroll-speed-value" for="scroll-speed">1×</output></label
                    >
                    <input
                        id="scroll-speed"
                        name="scrollSpeed"
                        type="range"
                        min="0.25"
                        max="32"
                        step="0.25"
                        value="1"
                    />
                </div>
                <hr />
                <label
                    ><input type="checkbox" name="invertMouseX" /><span class="checkbox" data-icon="check"></span>Invert
                    mouse X</label
                >
                <label
                    ><input type="checkbox" name="invertMouseY" /><span class="checkbox" data-icon="check"></span>Invert
                    mouse Y</label
                >
                <label
                    ><input type="checkbox" name="invertScrollX" /><span class="checkbox" data-icon="check"></span
                    >Invert scroll X</label
                >
                <label
                    ><input type="checkbox" name="invertScrollY" /><span class="checkbox" data-icon="check"></span
                    >Invert scroll Y</label
                >
                <hr />
                <label
                    ><input type="checkbox" name="functions" /><span class="checkbox" data-icon="check"></span>Show
                    Function keys rows</label
                >
                <label
                    ><input type="checkbox" name="media" /><span class="checkbox" data-icon="check"></span>Show media
                    keys row</label
                >
                <label
                    ><input type="checkbox" name="edit" checked /><span class="checkbox" data-icon="check"></span>Show
                    edit keys row</label
                >
                <label
                    ><input type="checkbox" name="modifiers" checked /><span class="checkbox" data-icon="check"></span
                    >Show modifier keys row</label
                >
                <hr />
                <label
                    ><input type="checkbox" name="sticky" /><span class="checkbox" data-icon="check"></span>Sticky
                    modifier keys</label
                >
                <hr />
                <div class="scale-setting">
                    <span id="ui-scale-label">Interface scale</span>
                    <div
                        class="stepper"
                        role="group"
                        aria-labelledby="ui-scale-label"
                        data-steps="0.25 0.33 0.5 0.67 0.75 0.8 0.9 1 1.1 1.25 1.5 1.75 2 2.5 3 4 5 6 8"
                    >
                        <button
                            type="button"
                            aria-label="Decrease interface scale"
                            data-step="-1"
                            data-icon="minus"
                        ></button>
                        <output id="ui-scale-value" for="ui-scale" aria-live="polite">1×</output>
                        <button
                            type="button"
                            aria-label="Increase interface scale"
                            data-step="1"
                            data-icon="plus"
                        ></button>
                    </div>
                    <input id="ui-scale" name="uiScale" type="hidden" min="0.25" max="8" value="1" />
                </div>
                <hr />
                <button id="options-reset" class="options-action" type="button">
                    <span data-icon="reset"></span>Reset options to defaults
                </button>
            </div>
        </main>
        <script src="/app.js" type="module"></script>
    </body>
</html>
